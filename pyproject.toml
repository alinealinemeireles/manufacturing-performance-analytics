[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-performance-analytics"
version = "1.3.0"
description = "Manufacturing quality, lean, maintenance and data analytics project"
# The pinned numpy 2.5.2 / scipy 1.18.1 / xgboost 3.4.1 publish no wheels for 3.11 (checked with
# `pip download --python-version 3.11`), so the real floor is 3.12; executed end to end on 3.14.7.
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
# The notebook source is linted as a notebook (magics, display calls), not as a module.
extend-exclude = ["manufacturing_performance_analytics.py", "SGI_Sistema-de-gestao-integrado"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
