[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-performance-analytics"
version = "1.2.0"
description = "Manufacturing quality, lean, maintenance and data analytics project"
# pandas 3.x / numpy 2.5 need >= 3.11; executed end to end on 3.14.7 (see requirements.txt)
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"
# The notebook source is linted as a notebook (magics, display calls), not as a module.
extend-exclude = ["manufacturing_performance_analytics.py", "SGI_Sistema-de-gestao-integrado"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
